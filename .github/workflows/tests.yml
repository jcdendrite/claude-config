# WARNING: The job id ("tests") is the status check context string
# referenced by branch protection on main. Renaming the job silently breaks
# the required-check match. If you rename the job, also update the
# required_status_checks.contexts list via:
#   gh api -X PUT repos/jcdendrite/claude-config/branches/main/protection
# A job-level "name:", when set, replaces the id as the context string, so the "tests" job carries none.
# The workflow-level "name:" does not affect the context string.
# The "tests" job is the aggregate at the end of this file, and passes only when every test-slice leg succeeds.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slice:
    runs-on: ubuntu-24.04
    strategy:
      # A failing leg must not cancel the other, so both passes report.
      fail-fast: false
      matrix:
        slice: [parallel, timing]
    # Each leg runs one pytest pass (see the "Run tests" steps below): the
    # parallel leg runs a pass under -n auto covering everything not marked
    # `timing`, and the timing leg runs a serial (-n0) pass covering only the
    # wall-clock-sensitive `timing` tests, which would flake under
    # sibling-worker load. The parallel leg dominates. It includes the
    # repo-wide lint in claude/.claude/hooks/tests/test_shellcheck.py, which
    # runs one shellcheck process over every discovered file, so more xdist
    # workers cannot shorten it. Re-derive this cap whenever the parallel
    # pass grows.
    timeout-minutes: 25
    env:
      # Dial CI parallelism from the repo Variables settings page (e.g.
      # during a flake incident) without a PR. Unset/empty falls through to
      # xdist's own auto-detection (psutil physical-core count if psutil is
      # importable, else os.cpu_count() logical cores).
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ vars.PYTEST_XDIST_AUTO_NUM_WORKERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which checks the diff needs
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fail open: if BASE is the zero SHA (first push, some force-push
          # scenarios) or unresolvable locally, run the test suite.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable ($BASE); running tests."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Deny-list of paths confirmed unread by any test module. Everything
          # else defaults to running the suite, so a new test-input path never
          # needs this list updated to be covered — only a path added here
          # needs the "confirmed unread by any test" check re-run.
          SKIP_REGEX='^(LICENSE$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|CONTRIBUTING\.md$)'

          SKIPPED=$(echo "$CHANGED" | grep -E "$SKIP_REGEX" || true)
          NOT_SKIPPED=$(echo "$CHANGED" | grep -vE "$SKIP_REGEX" || true)

          if [ -n "$SKIPPED" ]; then
            echo "Skipped (deny-listed):"; echo "$SKIPPED" | sed 's/^/  /'
          else
            echo "Skipped (deny-listed): (none)"
          fi
          if [ -n "$NOT_SKIPPED" ]; then
            echo "Not skipped (will run tests):"; echo "$NOT_SKIPPED" | sed 's/^/  /'
          else
            echo "Not skipped (will run tests): (none)"
          fi

          if [ -n "$NOT_SKIPPED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe — deliberately fail the parallel leg
        if: matrix.slice == 'parallel'
        run: exit 1

      - name: Skip — no test-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No test-relevant files changed; skipping pytest and ruff."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.detect.outputs.changed == 'true'
        with:
          # This pin sets the Python minor.
          # install-dev.sh, test_ci_python_matches_dev_interpreter.py and test_python_floor.py read it.
          # test_python_floor.py fails when _config.sh's floor, README.md's floor or ruff's target-version differs from it.
          python-version: '3.14'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: pip install -r requirements-dev.txt

      # test_relocate_claude_config.py exercises real stow/stow -D (not a
      # stub) — a fake stow would let a wrong working directory or -t/-d
      # targeting pass silently, which is exactly what that script's
      # correctness depends on. Likewise, test_ci_watch.py's real-direnv
      # tests exercise actual direnv hook output, not a stub, so direnv
      # must be a real binary too.
      - name: Install stow and direnv
        # Each "Run tests" step's `if:` below must stay this condition plus its own `matrix.slice` test, because conftest.py's require_direnv() hard-fail guarantee depends on it.
        if: steps.detect.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow direnv
          direnv --version

      # The pin is one Ubuntu 24.04 (noble) build version of git and git-man, installed by name from the runner's apt sources, which apt verifies against the signed index.
      # When Ubuntu supersedes the build, the install fails with a "Version ... was not found" error, and that failure is the signal to bump.
      # test_ci_git_equals_the_floor fails when the test steps run without this step.
      # To bump, take the newest noble-updates or noble-security build of git and git-man in the apt-cache policy table a failing run prints, and change the version in one PR. packages.ubuntu.com can list a build the runner's mirror does not carry yet.
      # The upstream version must keep the floor's major.minor, because test_git_floor.py ties the version to install.sh's GIT_MINIMUM_VERSION.
      - name: Install the pinned git package
        id: pin-git
        if: steps.detect.outputs.changed == 'true'
        env:
          CI_GIT_PACKAGE_VERSION: "1:2.43.0-1ubuntu7.4"
        run: |
          set -euo pipefail
          : "${CI_GIT_PACKAGE_VERSION:?}"

          # The earlier plain apt-get update exits 0 after a transient fetch error, so a source's list can stay stale.
          # --error-on=any fails this step on such an error instead, because a stale list would show up as a false "not found".
          sudo apt-get update --error-on=any

          echo "The image's git, and the apt sources and candidates for git and git-man:"
          git --version
          apt-cache policy git git-man

          if ! sudo apt-get install -y --no-remove --allow-downgrades "git=$CI_GIT_PACKAGE_VERSION" "git-man=$CI_GIT_PACKAGE_VERSION"; then
            {
              echo "apt could not install git and git-man $CI_GIT_PACKAGE_VERSION."
              echo "Read apt's error above and the apt-cache policy table printed earlier; if the error is a 'Version ... was not found' one, bump the pin as the comment above this step says."
            } >&2
            exit 1
          fi
          sudo apt-mark hold git git-man
          git --version

      - name: Report runner core count
        if: steps.detect.outputs.changed == 'true'
        run: nproc

      # Records the pinned git's version and which awk implementation runs the cumulative-review normalizer's tests.
      - name: Report runner git and awk versions
        if: steps.detect.outputs.changed == 'true'
        run: |
          git --version
          readlink -f "$(command -v awk)" || true
          { awk --version || awk -W version || awk -version; } </dev/null 2>/dev/null | head -n 1 || true

      # _locale_that_widens_ascii_ranges (test_config_lib.py) fails CI when no installed UTF-8 locale lets a bracket range accept a non-ASCII letter.
      # _locale_that_folds_ascii_capital_i_to_a_non_ascii_letter (test_reconcile_project_plugins.py) fails CI when no installed UTF-8 locale lower-cases `I` to a non-ASCII letter, which tr_TR does.
      - name: Generate UTF-8 locales
        if: steps.detect.outputs.changed == 'true'
        run: sudo locale-gen en_US.UTF-8 tr_TR.UTF-8

      - name: Run tests (parallel)
        # This step's `if:` must keep the condition described in the "Install stow and direnv" step's comment.
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'parallel'
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m "not timing"

      # This step's `if:` must keep the condition described in the "Install stow and direnv" step's comment.
      - name: Run tests (timing, serial)
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'timing'
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m timing -n0

      # Runs in the timing leg only, so it reports once.
      - name: Lint
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'timing'
        run: ruff check claude/.claude/ claude-skills/ plugins/ evals/

  tests:
    needs: test-slice
    # always(), not !cancelled(): a cancelled run must fail this required check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    # Bounds a stuck runner for one shell comparison; no vendor value applies.
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test-slice leg to succeed
        env:
          SLICE_RESULT: ${{ needs.test-slice.result }}
        run: |
          set -euo pipefail
          if [[ "$SLICE_RESULT" == "success" ]]; then
            exit 0
          fi
          echo "test-slice finished as '$SLICE_RESULT'; tests passes only when every leg succeeds." >&2
          exit 1
