# WARNING: The job id ("tests") is the status check context string
# referenced by branch protection on main. Renaming the job silently breaks
# the required-check match. If you rename the job, also update the
# required_status_checks.contexts list via:
#   gh api -X PUT repos/jcdendrite/claude-config/branches/main/protection
# (The workflow-level "name:" does NOT affect the context string for GitHub
# Actions checks — only the job id does.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    # pytest runs as two passes (see the "Run tests" steps below): a
    # parallel pass under -n auto covering everything not marked `timing`,
    # and a serial (-n0) pass covering only the wall-clock-sensitive `timing`
    # tests, which would flake under sibling-worker load. Those two passes
    # dominate the job. The parallel pass includes the repo-wide lint in
    # claude/.claude/hooks/tests/test_shellcheck.py, which runs one shellcheck
    # process over every discovered file, so more xdist workers cannot shorten
    # it. Re-derive this cap whenever either pass grows.
    timeout-minutes: 20
    env:
      # Dial CI parallelism from the repo Variables settings page (e.g.
      # during a flake incident) without a PR. Unset/empty falls through to
      # xdist's own auto-detection (psutil physical-core count if psutil is
      # importable, else os.cpu_count() logical cores).
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ vars.PYTEST_XDIST_AUTO_NUM_WORKERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which checks the diff needs
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fail open: if BASE is the zero SHA (first push, some force-push
          # scenarios) or unresolvable locally, run the test suite.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable ($BASE); running tests."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Deny-list of paths confirmed unread by any test module. Everything
          # else defaults to running the suite, so a new test-input path never
          # needs this list updated to be covered — only a path added here
          # needs the "confirmed unread by any test" check re-run.
          SKIP_REGEX='^(LICENSE$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|CONTRIBUTING\.md$)'

          SKIPPED=$(echo "$CHANGED" | grep -E "$SKIP_REGEX" || true)
          NOT_SKIPPED=$(echo "$CHANGED" | grep -vE "$SKIP_REGEX" || true)

          if [ -n "$SKIPPED" ]; then
            echo "Skipped (deny-listed):"; echo "$SKIPPED" | sed 's/^/  /'
          else
            echo "Skipped (deny-listed): (none)"
          fi
          if [ -n "$NOT_SKIPPED" ]; then
            echo "Not skipped (will run tests):"; echo "$NOT_SKIPPED" | sed 's/^/  /'
          else
            echo "Not skipped (will run tests): (none)"
          fi

          if [ -n "$NOT_SKIPPED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no test-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No test-relevant files changed; skipping pytest and ruff."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.changed == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: pip install -r requirements-dev.txt

      # test_relocate_claude_config.py exercises real stow/stow -D (not a
      # stub) — a fake stow would let a wrong working directory or -t/-d
      # targeting pass silently, which is exactly what that script's
      # correctness depends on. Likewise, test_ci_watch.py's real-direnv
      # tests exercise actual direnv hook output, not a stub, so direnv
      # must be a real binary too.
      - name: Install stow and direnv
        # This step's `if:` must keep matching both "Run tests" steps' `if:` below — conftest.py's require_direnv() hard-fail guarantee depends on all three staying in sync.
        if: steps.detect.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow direnv
          direnv --version

      - name: Report runner core count
        if: steps.detect.outputs.changed == 'true'
        run: nproc

      # Records the runner's git version and which awk implementation runs the cumulative-review normalizer's tests.
      - name: Report runner git and awk versions
        if: steps.detect.outputs.changed == 'true'
        run: |
          git --version
          readlink -f "$(command -v awk)" || true
          { awk --version || awk -W version || awk -version; } </dev/null 2>/dev/null | head -n 1 || true

      # _locale_that_widens_ascii_ranges (test_config_lib.py) fails CI when no installed UTF-8 locale lets a bracket range accept a non-ASCII letter.
      # _locale_that_folds_ascii_capital_i_to_a_non_ascii_letter (test_reconcile_project_plugins.py) fails CI when no installed UTF-8 locale lower-cases `I` to a non-ASCII letter, which tr_TR does.
      - name: Generate UTF-8 locales
        if: steps.detect.outputs.changed == 'true'
        run: sudo locale-gen en_US.UTF-8 tr_TR.UTF-8

      - name: Run tests (parallel)
        # This step's `if:` must keep matching "Install stow and direnv" above and "Run tests (timing, serial)" below — see that step's own comment.
        if: steps.detect.outputs.changed == 'true'
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m "not timing"

      # !cancelled() (not bare `if:`) so a parallel-pass failure above doesn't
      # suppress this step's own report in the same run.
      # This step's `if:` must keep matching "Install stow and direnv" and "Run tests (parallel)" above — see that step's own comment.
      - name: Run tests (timing, serial)
        if: ${{ !cancelled() && steps.detect.outputs.changed == 'true' }}
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m timing -n0

      - name: Lint
        if: steps.detect.outputs.changed == 'true'
        run: ruff check claude/.claude/ claude-skills/ plugins/ evals/
