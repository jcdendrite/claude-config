# WARNING: The job id ("tests") is the status check context string
# referenced by branch protection on main. Renaming the job silently breaks
# the required-check match. If you rename the job, also update the
# required_status_checks.contexts list via:
#   gh api -X PUT repos/jcdendrite/claude-config/branches/main/protection
# (The workflow-level "name:" does NOT affect the context string for GitHub
# Actions checks — only the job id does.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    # pytest alone consumes 72-92s of this budget; one hung-jq test can
    # additionally take up to ~12s
    # (claude/.claude/hooks/tests/test_hook_alignment.py, "elapsed < 12");
    # the shellcheck step adds ~10s. Two minutes left no headroom for a new
    # step.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect hook-relevant changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fail open: if BASE is the zero SHA (first push, some force-push
          # scenarios) or unresolvable locally, run both the test suite and
          # shellcheck. shell_changed must be set here too — it is otherwise
          # only computed further down, so this early exit would leave it
          # absent (not false), and an absent output never equals 'true',
          # silently skipping the shellcheck step while CI reports green.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable ($BASE); running tests and shellcheck."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "shell_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Include any directory that contains test files or whose contents are
          # read by tests. Update this list when a new test or test-input
          # directory appears under claude/.claude/ or plugins/skill-management/.
          # Also includes claude/.claude/agents/ (read by test_agent_roster.py),
          # claude/.claude/settings.json (read by test_doc_counts.py and
          # test_skills.py), README.md and docs/ (read by test_doc_counts.py).
          REGEX='^(claude/\.claude/(hooks|skills|scripts|tests|agents)/|claude/\.claude/settings\.json|plugins/skill-management/|README\.md$|docs/|\.github/workflows/tests\.yml|pyproject\.toml|install-dev\.sh|requirements-dev\.txt)'

          MATCHED=$(echo "$CHANGED" | grep -E "$REGEX" || true)
          UNMATCHED=$(echo "$CHANGED" | grep -vE "$REGEX" || true)

          if [ -n "$MATCHED" ]; then
            echo "Matched (will run tests):"; echo "$MATCHED" | sed 's/^/  /'
          else
            echo "Matched (will run tests): (none)"
          fi
          if [ -n "$UNMATCHED" ]; then
            echo "Unmatched (skipped):"; echo "$UNMATCHED" | sed 's/^/  /'
          else
            echo "Unmatched (skipped): (none)"
          fi

          if [ -n "$MATCHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Independent gate for the shellcheck step. Kept separate from REGEX
          # above, which means "directories containing test files or read by
          # tests" — a shell edit under plugins/ needs linting but not the full
          # pytest suite. Must cover every path shape that
          # scripts/list-shell-files.sh can return, plus .shellcheckrc (editing
          # it changes findings without touching any .sh file) and the
          # discovery script itself.
          SHELL_REGEX='(\.sh$|^claude/\.local/bin/|^plugins/lovable-cloud/scripts/|^\.shellcheckrc$|^scripts/list-shell-files\.sh$)'

          SHELL_MATCHED=$(echo "$CHANGED" | grep -E "$SHELL_REGEX" || true)
          if [ -n "$SHELL_MATCHED" ]; then
            echo "Matched (will run shellcheck):"; echo "$SHELL_MATCHED" | sed 's/^/  /'
            echo "shell_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Matched (will run shellcheck): (none)"
            echo "shell_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no hook-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No hook-relevant files changed; skipping pytest."

      # Gated on either output: shellcheck ships as a pip wheel, so a PR that
      # only touches shell files outside REGEX still needs the toolchain.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.shell_changed == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.shell_changed == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run tests
        if: steps.detect.outputs.changed == 'true'
        run: pytest claude/.claude/ -v

      - name: Lint
        if: steps.detect.outputs.changed == 'true'
        run: ruff check claude/.claude/

      - name: Shellcheck
        if: steps.detect.outputs.shell_changed == 'true'
        run: |
          set -euo pipefail
          # The runner image may carry its own shellcheck; confirm the pinned
          # wheel wins PATH resolution rather than silently linting with a
          # different version.
          which shellcheck
          shellcheck --version
          # No flags: .shellcheckrc supplies them. Exit 3 on an empty file
          # list is a feature — a broken discovery regex fails loudly instead
          # of passing vacuously, so this is deliberately not `|| true`.
          ./scripts/list-shell-files.sh | xargs -0 shellcheck
