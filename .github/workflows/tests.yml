# WARNING: The job id ("tests") is the status check context string
# referenced by branch protection on main. Renaming the job silently breaks
# the required-check match. If you rename the job, also update the
# required_status_checks.contexts list via:
#   gh api -X PUT repos/jcdendrite/claude-config/branches/main/protection
# (The workflow-level "name:" does NOT affect the context string for GitHub
# Actions checks — only the job id does.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    # pytest now runs as two passes (see the "Run tests" steps below): a
    # parallel pass under -n auto covering everything not marked `timing`,
    # and a serial (-n0) pass covering only the wall-clock-sensitive `timing`
    # tests, which would flake under sibling-worker load. Each pass pays its
    # own full collection; the timing pass also carries the suite's
    # deliberate timeout-blocking tests one at a time (e.g.
    # claude/.claude/hooks/tests/test_hook_alignment.py's "elapsed < 12" and
    # claude/.claude/hooks/tests/test_deny_pii_in_commits.py's four
    # "elapsed < 9.5" git-timeout tests). A single-invocation run (pre-split)
    # measured ~4m7s (PR #611's CI run,
    # https://github.com/jcdendrite/claude-config/actions/runs/31421062875/job/93561720972);
    # the two-pass split trades that one number for parallel-pass wall time
    # plus a mostly-serial timing pass, not yet re-measured end to end here.
    # Add to that the shellcheck step (~10s) and apt-get update + install
    # stow (~10-20s on a typical runner, more on a stale package-index
    # cache). 10 minutes gives headroom above the two-pass total so
    # continued organic test-suite growth doesn't require another bump on
    # every PR that happens to add the next test.
    timeout-minutes: 10
    env:
      # Dial CI parallelism from the repo Variables settings page (e.g.
      # during a flake incident) without a PR. Unset/empty falls through to
      # xdist's own auto-detection (psutil physical-core count if psutil is
      # importable, else os.cpu_count() logical cores).
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ vars.PYTEST_XDIST_AUTO_NUM_WORKERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect hook-relevant changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fail open: if BASE is the zero SHA (first push, some force-push
          # scenarios) or unresolvable locally, run both the test suite and
          # shellcheck. shell_changed must be set here too — it is otherwise
          # only computed further down, so this early exit would leave it
          # absent (not false), and an absent output never equals 'true',
          # silently skipping the shellcheck step while CI reports green.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable ($BASE); running tests and shellcheck."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "shell_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Deny-list of paths confirmed unread by any test module. Everything
          # else defaults to running the suite, so a new test-input path never
          # needs this list updated to be covered — only a path added here
          # needs the "confirmed unread by any test" check re-run.
          SKIP_REGEX='^(LICENSE$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|CONTRIBUTING\.md$)'

          SKIPPED=$(echo "$CHANGED" | grep -E "$SKIP_REGEX" || true)
          NOT_SKIPPED=$(echo "$CHANGED" | grep -vE "$SKIP_REGEX" || true)

          if [ -n "$SKIPPED" ]; then
            echo "Skipped (deny-listed):"; echo "$SKIPPED" | sed 's/^/  /'
          else
            echo "Skipped (deny-listed): (none)"
          fi
          if [ -n "$NOT_SKIPPED" ]; then
            echo "Not skipped (will run tests):"; echo "$NOT_SKIPPED" | sed 's/^/  /'
          else
            echo "Not skipped (will run tests): (none)"
          fi

          if [ -n "$NOT_SKIPPED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Independent gate for the shellcheck step. Kept separate from
          # SKIP_REGEX above — a shell edit under plugins/ needs linting but
          # not the full pytest suite. Must cover every path shape that
          # scripts/list-shell-files.sh can return, plus .shellcheckrc (editing
          # it changes findings without touching any .sh file) and the
          # discovery script itself.
          SHELL_REGEX='(\.sh$|^claude/\.local/bin/|^plugins/lovable-cloud/scripts/|^\.shellcheckrc$|^scripts/list-shell-files\.sh$)'

          SHELL_MATCHED=$(echo "$CHANGED" | grep -E "$SHELL_REGEX" || true)
          if [ -n "$SHELL_MATCHED" ]; then
            echo "Matched (will run shellcheck):"; echo "$SHELL_MATCHED" | sed 's/^/  /'
            echo "shell_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Matched (will run shellcheck): (none)"
            echo "shell_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no hook-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No hook-relevant files changed; skipping pytest."

      # Gated on either output: shellcheck ships as a pip wheel, so a PR that
      # touches only SKIP_REGEX-skipped (pytest-irrelevant) paths but also a
      # shell file still needs the toolchain.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.shell_changed == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true' || steps.detect.outputs.shell_changed == 'true'
        run: pip install -r requirements-dev.txt

      # test_relocate_claude_config.py exercises real stow/stow -D (not a
      # stub) — a fake stow would let a wrong working directory or -t/-d
      # targeting pass silently, which is exactly what that script's
      # correctness depends on.
      - name: Install stow
        if: steps.detect.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Report runner core count
        if: steps.detect.outputs.changed == 'true'
        run: nproc

      - name: Run tests (parallel)
        if: steps.detect.outputs.changed == 'true'
        run: pytest claude/.claude/ claude-skills/ plugins/ -v -m "not timing"

      # !cancelled() (not bare `if:`) so a parallel-pass failure above doesn't
      # suppress this step's own report in the same run.
      - name: Run tests (timing, serial)
        if: ${{ !cancelled() && steps.detect.outputs.changed == 'true' }}
        run: pytest claude/.claude/ claude-skills/ plugins/ -v -m timing -n0

      - name: Lint
        if: steps.detect.outputs.changed == 'true'
        run: ruff check claude/.claude/ claude-skills/ plugins/

      - name: Shellcheck
        if: steps.detect.outputs.shell_changed == 'true'
        run: |
          set -euo pipefail
          # The runner image may carry its own shellcheck; confirm the pinned
          # wheel wins PATH resolution rather than silently linting with a
          # different version.
          which shellcheck
          shellcheck --version
          # No flags: .shellcheckrc supplies them. Exit 3 on an empty file
          # list is a feature — a broken discovery regex fails loudly instead
          # of passing vacuously, so this is deliberately not `|| true`.
          ./scripts/list-shell-files.sh | xargs -0 shellcheck
